[project]
name = "xedocs"
version = "0.2.44"
description = "Top-level package for xedocs."
readme = "README.rst"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Yossi Mosbacher", email = "joe.mosbacher@gmail.com" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "click",
  "rich",
  "rframe>=0.2.25",
  "appdirs>=1.4.4",
  "tqdm>=4.67.1",
  "pyyaml>=6",
  "parse>=1.20.2",
]

[project.urls]
Homepage = "https://github.com/XENONnT/xedocs"

[project.optional-dependencies]
db = ["pymongo"]
github = ["xeauth>=0.2.3"]
all = [
  "pymongo",
  "xeauth>=0.2.3",
]

[project.scripts]
xedocs = "xedocs.cli:main"

[project.entry-points.straxen]
xedocs_protocol = "xedocs._straxen_plugin"

[tool.poetry]
packages = [
  { include = "xedocs" },
  { include = "tests", format = "sdist" },
]

[tool.poetry.group.dev.dependencies]
bumpversion = "*"
coverage = "*"
flake8 = "*"
isort = "*"
pylint = "*"
pytest = "*"
sphinx = "*"
tox = "*"
yapf = "*"
sphinx-material = "*"
invoke = "*"
black = "*"
pytest-cov = "*"
hypothesis = "*"
autodoc-pydantic = "*"
jupyterlite-sphinx = "*"
sphinxext-rediraffe = "*"
pymongo = "*"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poe.tasks]
test   = "pytest --cov=xedocs"
format = "black ."
clean  = """
    rm -rf .coverage
        .mypy_cache
        .pytest_cache
        dist
        ./**/__pycache__
    """
lint   = "pylint xedocs"
